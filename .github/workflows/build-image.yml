name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'vrbne' }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build TypeScript
        run: |
          npm ci
          npm run build
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to container registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/security-scan:${{ github.sha }}

      - name: Report image vulnerabilities
        id: vulnerability-report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          image-ref: local/security-scan:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          image-ref: local/security-scan:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Publish scanned image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker tag local/security-scan:${{ github.sha }} "${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker push "${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
